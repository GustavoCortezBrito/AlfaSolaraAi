<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente metálico prateado (mantém identidade Alfa) -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente azul/cyan para elementos solares -->
    <linearGradient id="solarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente amarelo/laranja para sol -->
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Sombra -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Brilho -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#1e293b"/>
  
  <!-- Sol estilizado (atrás do logo) -->
  <g opacity="0.3">
    <circle cx="200" cy="140" r="60" fill="url(#sunGradient)" filter="url(#glow)"/>
    <!-- Raios do sol -->
    <g stroke="url(#sunGradient)" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <line x1="200" y1="60" x2="200" y2="40"/>
      <line x1="245" y1="75" x2="260" y2="60"/>
      <line x1="260" y1="140" x2="280" y2="140"/>
      <line x1="245" y1="205" x2="260" y2="220"/>
      <line x1="155" y1="75" x2="140" y2="60"/>
      <line x1="140" y1="140" x2="120" y2="140"/>
      <line x1="155" y1="205" x2="140" y2="220"/>
    </g>
  </g>
  
  <!-- Logo Alfa (duplo A metálico) -->
  <g filter="url(#shadow)">
    <!-- Primeiro A -->
    <path d="M 100 300 L 170 120 L 210 120 L 280 300 L 240 300 L 225 250 L 155 250 L 140 300 Z M 168 210 L 212 210 L 190 150 Z" 
          fill="url(#metalGradient)" 
          stroke="#9ca3af" 
          stroke-width="2"/>
    
    <!-- Segundo A (efeito duplo) -->
    <path d="M 120 300 L 190 120 L 230 120 L 300 300 L 260 300 L 245 250 L 175 250 L 160 300 Z M 188 210 L 232 210 L 210 150 Z" 
          fill="url(#metalGradient)" 
          stroke="#9ca3af" 
          stroke-width="2" 
          opacity="0.9"/>
  </g>
  
  <!-- Painel solar estilizado (integrado ao logo) -->
  <g opacity="0.8">
    <!-- Linhas de painel solar sobre o A -->
    <g stroke="url(#solarGradient)" stroke-width="2" opacity="0.6">
      <line x1="150" y1="180" x2="250" y2="180"/>
      <line x1="155" y1="195" x2="245" y2="195"/>
      <line x1="160" y1="210" x2="240" y2="210"/>
    </g>
    
    <!-- Células solares (pequenos quadrados) -->
    <g fill="url(#solarGradient)" opacity="0.4">
      <rect x="165" y="175" width="8" height="8" rx="1"/>
      <rect x="180" y="175" width="8" height="8" rx="1"/>
      <rect x="195" y="175" width="8" height="8" rx="1"/>
      <rect x="210" y="175" width="8" height="8" rx="1"/>
      <rect x="225" y="175" width="8" height="8" rx="1"/>
      
      <rect x="170" y="190" width="8" height="8" rx="1"/>
      <rect x="185" y="190" width="8" height="8" rx="1"/>
      <rect x="200" y="190" width="8" height="8" rx="1"/>
      <rect x="215" y="190" width="8" height="8" rx="1"/>
      <rect x="230" y="190" width="8" height="8" rx="1"/>
    </g>
  </g>
  
  <!-- Texto ALFA SOLAR -->
  <g>
    <text x="200" y="345" 
          font-family="Arial, sans-serif" 
          font-size="32" 
          font-weight="bold" 
          text-anchor="middle" 
          fill="url(#metalGradient)" 
          letter-spacing="4px">
      ALFA
    </text>
    
    <text x="200" y="375" 
          font-family="Arial, sans-serif" 
          font-size="24" 
          font-weight="bold" 
          text-anchor="middle" 
          fill="url(#solarGradient)" 
          letter-spacing="6px">
      SOLAR
    </text>
  </g>
  
  <!-- Ícone de raio/energia (canto) -->
  <g transform="translate(320, 100)" opacity="0.6">
    <path d="M 0 0 L -8 12 L -2 12 L -4 20 L 4 8 L -2 8 Z" 
          fill="url(#solarGradient)" 
          filter="url(#glow)"/>
  </g>
</svg>
